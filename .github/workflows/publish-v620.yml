name: Publicar JANUS Dock 6.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v620.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generar icono
        shell: pwsh
        run: ./generate-icon.ps1
      - name: Compilar versiones portatiles
        shell: pwsh
        run: |
          dotnet publish JanusDock.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist-compact
          if ($LASTEXITCODE -ne 0) { throw "Fallo version liviana" }
          dotnet publish JanusDock.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist-standalone
          if ($LASTEXITCODE -ne 0) { throw "Fallo version autonoma" }
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Construir instalador JANUS Dock 6.2
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup no disponible" }
          & $iscc installer\JanusDock.iss
          if ($LASTEXITCODE -ne 0) { throw "Fallo instalador" }
      - name: Preparar archivos y hashes
        shell: pwsh
        run: |
          Compress-Archive dist-compact/JanusDock.exe JANUS-Dock-Liviano-Windows-x64.zip
          Compress-Archive dist-standalone/JanusDock.exe JANUS-Dock-Autonomo-Windows-x64.zip
          $files = @("JANUS-Dock-Liviano-Windows-x64.zip", "JANUS-Dock-Autonomo-Windows-x64.zip", "installer-output/JANUS-Dock-Setup-6.2-Autonomo.exe")
          foreach ($file in $files) { if (!(Test-Path $file)) { throw "Falta archivo: $file" } }
          $files | ForEach-Object { Get-FileHash $_ -Algorithm SHA256 } | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
      - name: Publicar Release 6.2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          @'
          # JANUS Dock 6.2.0
          
          Barra de accesos personalizable para Windows 10/11 (x64).
          
          ## Descargas
          - **JANUS-Dock-Setup-6.2-Autonomo.exe**: recomendado, con .NET incluido, acceso en Inicio y opción de arranque con Windows.
          - **JANUS-Dock-Autonomo-Windows-x64.zip**: versión portátil con .NET incluido.
          - **JANUS-Dock-Liviano-Windows-x64.zip**: portátil, requiere .NET 8 Desktop Runtime x64.
          - **SHA256SUMS.txt**: hashes de verificación.
          
          ## Novedades
          - Idiomas Español (Chile), inglés y portugués (traducciones iniciales).
          - Banderas dibujadas directamente en el selector de idioma.
          - Información Acerca de actualizada con versión 6.2.
          - Instalador con descripción de JANUS Dock.
          - Monitor de CPU/RAM, discos y promedio de red de 60 segundos.
          - Opciones modernas, tamaño de iconos hasta 96 px y paleta de colores por disco.
          
          El botón Buscar actualizaciones abre GitHub; la instalación automática desde la aplicación no forma parte de esta versión.
          
          Proyecto Momocrackcorp · Ñuble, Chile.
          '@ | Set-Content notes.md -Encoding utf8
          gh release create v6.2.0 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "JANUS Dock v6.2.0" --notes-file notes.md JANUS-Dock-Liviano-Windows-x64.zip JANUS-Dock-Autonomo-Windows-x64.zip installer-output/JANUS-Dock-Setup-6.2-Autonomo.exe SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar la release" }
